# FORGE AI platform (API + web frontend).
# Usage: cp .env.example .env  (optionally set USE_LLM=true, LLM_PROVIDER and that provider's key)
#        docker compose up --build
# Web app: http://localhost:3000   API docs: http://localhost:8000/docs
#
# Note: applications generated by FORGE AI ship their own docker-compose.yml with PostgreSQL.
# Live previews of generated apps run inside the forge-api container on random local ports and are
# therefore reachable from the host only when running the platform natively (see README).
services:
  forge-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      USE_LLM: ${USE_LLM:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      FORGE_QA_FRONTEND_BUILD: ${FORGE_QA_FRONTEND_BUILD:-true}
      FORGE_SECRET_KEY: ${FORGE_SECRET_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - forge_workspace:/app/workspace

  forge-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - forge-api
    ports:
      - "3000:3000"

volumes:
  forge_workspace:
