# FORGE AI platform (API + dashboard).
# Usage: cp .env.example .env  (optionally add GOOGLE_API_KEY)  &&  docker compose up --build
# Dashboard: http://localhost:3000   API docs: http://localhost:8000/docs
#
# Note: applications generated by FORGE AI ship their own docker-compose.yml with PostgreSQL.
# Live previews of generated apps run inside the forge-api container on random local ports and are
# therefore reachable from the host only when running the platform natively (see README).
services:
  forge-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      USE_LLM: ${USE_LLM:-false}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      FORGE_QA_FRONTEND_BUILD: ${FORGE_QA_FRONTEND_BUILD:-true}
    ports:
      - "8000:8000"
    volumes:
      - forge_workspace:/app/workspace

  forge-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - forge-api
    ports:
      - "3000:80"

volumes:
  forge_workspace:
